name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild synthetic sample
        run: python -m publishing_qa build --workspace sample --output sample/output
      - name: Verify release checksums
        run: python -m publishing_qa verify --output sample/output
